name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build:win

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: powertoys-color-picker-tray-windows
        path: dist/*.exe
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: powertoys-color-picker-tray-windows

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          PowerToys Color Picker Tray ${{ github.ref_name }}

          **Download Options**:
          - **PowerToysColorPickerTray.exe** - Portable version (no installation required)
          - **PowerToysColorPickerTray.setup.${{ github.ref_name }}.exe** - Installer version

          Choose the portable version for a single executable, or the installer for a traditional installation experience.
        files: '*.exe'
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
